name: Morning board

on:
  schedule:
    - cron: "17 8 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      date:
        description: "Board date to pool (YYYY-MM-DD); defaults to today in New York"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: morning-pool
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record checked-out revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve board date
        id: board
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            date="$INPUT_DATE"
          else
            date="$(TZ=America/New_York date +%F)"
          fi
          if [[ ! "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date: $date" >&2
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Keep published boards frozen
        id: frozen
        env:
          BOARD_DATE: ${{ steps.board.outputs.date }}
        run: |
          if [[ -f "src/boards/$BOARD_DATE.json" ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "$BOARD_DATE is already published; nothing to do."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull nominations
        if: steps.frozen.outputs.value != 'true'
        run: npm run pool -- "${{ steps.board.outputs.date }}"

      - name: Cut and generate the complete board
        if: steps.frozen.outputs.value != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAPERSCROLL_MODEL: gpt-4o-mini
        run: npm run publish -- "${{ steps.board.outputs.date }}"

      - name: Validate product build
        if: steps.frozen.outputs.value != 'true'
        run: |
          node --check scripts/pool.mjs
          node --check scripts/rank.mjs
          node --check scripts/publish.mjs
          node --check scripts/validate-board.mjs
          npm run validate-board -- "${{ steps.board.outputs.date }}"
          npm run lint
          npm run build

      - name: Validate publication diff
        if: steps.frozen.outputs.value != 'true'
        env:
          BOARD_DATE: ${{ steps.board.outputs.date }}
        run: |
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev "^(src/pools/$BOARD_DATE.json|src/boards/$BOARD_DATE.json|src/boards/generated.ts)$" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          test -f "src/pools/$BOARD_DATE.json"
          test -f "src/boards/$BOARD_DATE.json"

      - name: Publish to main
        if: steps.frozen.outputs.value != 'true'
        env:
          BOARD_DATE: ${{ steps.board.outputs.date }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [[ "$(git rev-parse "origin/$GITHUB_REF_NAME")" != "$BASE_SHA" ]]; then
            echo "main advanced during generation; refusing to publish stale output" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/pools/$BOARD_DATE.json" "src/boards/$BOARD_DATE.json" src/boards/generated.ts
          git commit -m "Publish morning board for $BOARD_DATE"
          git push origin "HEAD:$GITHUB_REF_NAME"
